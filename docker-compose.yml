version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: rri_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: rri_orchestrator
      POSTGRES_USER: rri_user
      POSTGRES_PASSWORD: rri_password
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rri_user -d rri_orchestrator"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Adminer - Web-based database management UI (access at localhost:8081)
  adminer:
    image: adminer:latest
    container_name: rri_adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - postgres
    environment:
      ADMINER_DEFAULT_SERVER: postgres
