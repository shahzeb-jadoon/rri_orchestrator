[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rri-orchestrator-mcp"
version = "0.1.0"
description = "LangGraph + MCP multi-agent orchestrator scaffold (cyclic state machine, self-consistency risk gating, Human-in-the-Loop)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.28",
    "langchain-core>=0.3",
    "litellm>=1.40",
    "mcp>=1.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
postgres = ["psycopg[binary]>=3.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
